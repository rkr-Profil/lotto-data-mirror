name: update-draws

# Läuft täglich früh (UTC) + manuell. Holt die Quell-Daten, normalisiert sie
# und committet geänderte data/*.json zurück ins Repo. Die App/Function liest
# die Roh-URLs: https://raw.githubusercontent.com/<user>/<repo>/main/data/<key>.json
on:
  schedule:
    - cron: "20 5 * * *"   # 05:20 UTC ~ 07:20 Wien
  workflow_dispatch:
    inputs:
      probe:
        description: "Nur diagnostizieren (schreibt nichts) — zeigt ob die Quell-IP durchkommt"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch & normalize
        run: |
          if [ "${{ inputs.probe }}" = "true" ]; then
            node scripts/run.mjs --probe
          else
            node scripts/run.mjs
          fi

      - name: Commit changed data
        if: ${{ inputs.probe != true }}
        run: |
          git config user.name  "lotto-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "data: update draws $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Keine Änderungen."
          fi

      # Schickt die run-summary.txt (welche Systeme geholt wurden) ans Handy.
      # Voraussetzung: Repo-Secret NTFY_URL = https://ntfy.sh/<dein-topic>. Ohne Secret: übersprungen.
      - name: Handy-Benachrichtigung (ntfy)
        if: ${{ always() && inputs.probe != true }}
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ -z "$NTFY_URL" ]; then echo "NTFY_URL-Secret nicht gesetzt — keine Benachrichtigung."; exit 0; fi
          if [ -f run-summary.txt ]; then MSG="$(cat run-summary.txt)"; else MSG="🎰 Lucky-Space: Lauf beendet, aber keine Zusammenfassung (evtl. Fehler)."; fi
          curl -s -H "Title: Lucky-Space Lotto-Update" -H "Tags: game_die" -d "$MSG" "$NTFY_URL" >/dev/null \
            && echo "Benachrichtigung gesendet." || echo "Benachrichtigung fehlgeschlagen (nicht kritisch)."
